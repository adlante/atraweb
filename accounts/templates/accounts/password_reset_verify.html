{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آترا | تایید هویت</title>
    <link rel="stylesheet" href="{% static 'css/oauth/password.css' %}">
</head>
<body class="bg-verify">
    <div class="overlay"></div>
    <div class="card">
        <div class="logo">AT<span>RA</span></div>
        <h2>تایید هویت</h2>
        <p class="subtitle">کد ۵ رقمی پیامک شده را وارد کنید.</p>
        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="code" class="otp-input" placeholder="- - - - -" maxlength="5" autocomplete="off" required>
            </div>
            <button type="submit" class="btn-submit">بررسی کد و ادامه ➔</button>
        </form>
        <a href="{% url 'accounts:password_reset_request' %}" class="action-link resend-link">تغییر نام کاربری / ایمیل</a>
    </div>
</body>
</html>
