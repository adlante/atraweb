{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آترا | تنظیم رمز عبور جدید</title>
    <link rel="stylesheet" href="{% static 'css/oauth/password.css' %}">
</head>
<body class="bg-confirm">
    <div class="overlay"></div>
    <div class="card">
        <div class="logo">AT<span>RA</span></div>
        <h2>رمز عبور جدید</h2>
        <p class="subtitle">هویت شما تایید شد. لطفا رمز عبور جدید خود را وارد کنید.</p>
        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <input type="password" name="new_password" class="ltr-input" placeholder="رمز عبور جدید (حداقل ۸ کاراکتر)" required>
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" class="ltr-input" placeholder="تکرار رمز عبور جدید" required>
            </div>
            <button type="submit" class="btn-submit">ذخیره رمز عبور و ورود ➔</button>
        </form>
    </div>
</body>
</html>
