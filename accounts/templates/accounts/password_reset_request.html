{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آترا | فراموشی رمز عبور</title>
    <link rel="stylesheet" href="{% static 'css/oauth/password.css' %}">
</head>
<body class="bg-request">
    <div class="overlay"></div>
    <div class="card">
        <div class="logo">AT<span>RA</span></div>
        <h2>فراموشی رمز عبور!</h2>
        <p class="subtitle">نام کاربری یا ایمیل خود را وارد کنید تا کد تایید برای شما پیامک شود.</p>
        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="username_or_email" placeholder="نام کاربری یا ایمیل..." required>
            </div>
            <button type="submit" class="btn-submit">ارسال کد تایید ➔</button>
        </form>
        <a href="{% url 'accounts:login' %}" class="action-link">بازگشت به صفحه ورود</a>
    </div>
</body>
</html>
